UI menu.c32
PROMPT 0
TIMEOUT 50
DEFAULT lmg-live

MENU TITLE LMG OS 1.0.0 Boot Menu (MineswordTeam)

LABEL lmg-live
  MENU LABEL LMG OS 1.0.0 Live (Debian 13.6 Trixie x86_64)
  KERNEL /live/vmlinuz
  APPEND initrd=/live/initrd.img boot=live quiet splash plymouth.ignore-serial-consoles

LABEL lmg-install
  MENU LABEL Install LMG OS 1.0.0 to Disk
  KERNEL /live/vmlinuz
  APPEND initrd=/live/initrd.img boot=live quiet splash calamares
